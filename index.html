<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Xếp Hạng Pickleball</title>
    <style>
        :root { --primary: #2e7d32; --bg: #f4f7f6; --card: #ffffff; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1, h2 { color: var(--primary); margin-top: 0; }
        h1 { text-align: center; margin-bottom: 30px; grid-column: span 2; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #1b5e20; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #e8f5e9; color: var(--primary); }
        .history-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .win { color: var(--primary); font-weight: bold; }
        .lose { color: #d32f2f; }
        .elo-change { font-size: 0.9em; color: #555; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Bảng Xếp Hạng & Lịch Sử Pickleball</h1>

    <!-- Cột trái: Thêm người chơi và Xếp hạng -->
    <div class="card">
        <h2>Thêm Vận Động Viên</h2>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="newPlayerName" placeholder="Nhập tên người chơi...">
            <button style="width: 100px;" onclick="addPlayer()">Thêm</button>
        </div>
    </div>

    <div class="card" style="grid-row: span 2;">
        <h2>Bảng Xếp Hạng Elo</h2>
        <table>
            <thead>
                <tr>
                    <th>Hạng</th>
                    <th>Tên</th>
                    <th>Elo</th>
                    <th>Trận</th>
                    <th>Tỉ lệ Thắng</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <!-- JS sẽ điền dữ liệu vào đây -->
            </tbody>
        </table>
    </div>

    <!-- Cột phải: Nhập kết quả -->
    <div class="card">
        <h2>Nhập Kết Quả Trận Đấu</h2>
        <label>Thể thức thi đấu:</label>
        <select id="matchFormat" onchange="toggleFormat()">
            <option value="1v1">Đánh Đơn (1 vs 1)</option>
            <option value="2v2">Đánh Đôi (2 vs 2)</option>
        </select>

        <div style="display: flex; gap: 20px; margin-top: 10px;">
            <div style="flex: 1;">
                <h3 style="margin: 5px 0;">Đội 1</h3>
                <select id="t1p1"></select>
                <select id="t1p2" style="display: none;"></select>
            </div>
            <div style="flex: 1;">
                <h3 style="margin: 5px 0;">Đội 2</h3>
                <select id="t2p1"></select>
                <select id="t2p2" style="display: none;"></select>
            </div>
        </div>

        <label style="display: block; margin-top: 15px;">Kết quả:</label>
        <select id="matchWinner">
            <option value="1">Đội 1 Thắng</option>
            <option value="2">Đội 2 Thắng</option>
        </select>

        <button onclick="saveMatch()" style="margin-top: 15px;">Lưu Trận Đấu</button>
    </div>

    <div class="card full-width">
        <h2>Lịch Sử Đối Đầu</h2>
        <div id="historyContainer">
            <!-- JS sẽ điền dữ liệu vào đây -->
        </div>
    </div>
</div>

<script>
    // Khởi tạo dữ liệu từ LocalStorage (để không bị mất khi F5)
    let players = JSON.parse(localStorage.getItem('pb_players')) || {};
    let matches = JSON.parse(localStorage.getItem('pb_matches')) || [];

    // Lưu dữ liệu
    function saveData() {
        localStorage.setItem('pb_players', JSON.stringify(players));
        localStorage.setItem('pb_matches', JSON.stringify(matches));
        updateUI();
    }

    // Thêm người chơi
    function addPlayer() {
        const name = document.getElementById('newPlayerName').value.trim();
        if (name && !players[name]) {
            players[name] = { elo: 1200, matches: 0, wins: 0 };
            document.getElementById('newPlayerName').value = '';
            saveData();
        } else {
            alert("Tên bị trống hoặc đã tồn tại!");
        }
    }

    // Chuyển đổi giao diện 1v1 và 2v2
    function toggleFormat() {
        const is2v2 = document.getElementById('matchFormat').value === '2v2';
        document.getElementById('t1p2').style.display = is2v2 ? 'block' : 'none';
        document.getElementById('t2p2').style.display = is2v2 ? 'block' : 'none';
    }

    // Tính toán Elo
    function calculateElo(ratingA, ratingB, aWon) {
        const K = 32;
        const expectedA = 1 / (1 + Math.pow(10, (ratingB - ratingA) / 400));
        const actualA = aWon ? 1 : 0;
        return Math.round(K * (actualA - expectedA));
    }

    // Xử lý lưu trận đấu
    function saveMatch() {
        const format = document.getElementById('matchFormat').value;
        const winner = document.getElementById('matchWinner').value;
        
        let t1 = [document.getElementById('t1p1').value];
        let t2 = [document.getElementById('t2p1').value];

        if (format === '2v2') {
            t1.push(document.getElementById('t1p2').value);
            t2.push(document.getElementById('t2p2').value);
        }

        // Kiểm tra trùng lặp người chơi
        const allPlayers = format === '2v2' ? [...t1, ...t2] : [t1[0], t2[0]];
        const uniquePlayers = new Set(allPlayers);
        if (uniquePlayers.size !== allPlayers.length || allPlayers.includes("")) {
            alert("Vui lòng chọn người chơi hợp lệ. Một người không thể thi đấu ở cả hai đội cùng lúc.");
            return;
        }

        // Lấy Elo trung bình của mỗi đội
        let eloT1 = format === '2v2' ? (players[t1[0]].elo + players[t1[1]].elo) / 2 : players[t1[0]].elo;
        let eloT2 = format === '2v2' ? (players[t2[0]].elo + players[t2[1]].elo) / 2 : players[t2[0]].elo;

        // Tính độ thay đổi Elo (đội 1 thắng truyền vào true, đội 2 thắng truyền vào false)
        const t1Won = winner === '1';
        const eloChange = calculateElo(eloT1, eloT2, t1Won);

        // Cập nhật điểm cho từng người chơi
        t1.forEach(p => {
            players[p].elo += eloChange;
            players[p].matches += 1;
            if (t1Won) players[p].wins += 1;
        });
        
        t2.forEach(p => {
            players[p].elo -= eloChange; // Đội 2 bị trừ điểm tương đương đội 1 được cộng
            players[p].matches += 1;
            if (!t1Won) players[p].wins += 1;
        });

        // Lưu lịch sử
        matches.unshift({
            date: new Date().toLocaleString('vi-VN'),
            format: format,
            t1: t1,
            t2: t2,
            winner: winner,
            eloChange: Math.abs(eloChange)
        });

        saveData();
    }

    // Cập nhật giao diện
    function updateUI() {
        const playerNames = Object.keys(players);
        
        // Cập nhật dropdowns
        const selects = ['t1p1', 't1p2', 't2p1', 't2p2'];
        selects.forEach(id => {
            const select = document.getElementById(id);
            const currentVal = select.value;
            select.innerHTML = '<option value="">-- Chọn --</option>' + 
                playerNames.map(p => `<option value="${p}">${p}</option>`).join('');
            if (playerNames.includes(currentVal)) select.value = currentVal;
        });

        // Cập nhật bảng xếp hạng
        const sortedPlayers = playerNames.map(name => ({name, ...players[name]})).sort((a, b) => b.elo - a.elo);
        document.getElementById('leaderboardBody').innerHTML = sortedPlayers.map((p, index) => `
            <tr>
                <td><b>#${index + 1}</b></td>
                <td>${p.name}</td>
                <td><b>${p.elo}</b></td>
                <td>${p.matches}</td>
                <td>${p.matches > 0 ? Math.round((p.wins / p.matches) * 100) : 0}%</td>
            </tr>
        `).join('');

        // Cập nhật lịch sử
        document.getElementById('historyContainer').innerHTML = matches.map(m => {
            const t1Name = m.t1.join(' & ');
            const t2Name = m.t2.join(' & ');
            const t1Class = m.winner === '1' ? 'win' : 'lose';
            const t2Class = m.winner === '2' ? 'win' : 'lose';
            const changeTag = `<span class="elo-change">(±${m.eloChange} Elo)</span>`;
            
            return `
                <div class="history-item">
                    <div>
                        <span class="${t1Class}">${t1Name}</span> vs <span class="${t2Class}">${t2Name}</span>
                        <br><small style="color:#888">${m.date} - ${m.format}</small>
                    </div>
                    <div>
                        ${m.winner === '1' ? '🏆 Đội 1 Thắng' : '🏆 Đội 2 Thắng'} <br> ${changeTag}
                    </div>
                </div>
            `;
        }).join('');
    }

    // Khởi chạy lần đầu
    updateUI();
</script>
</body>
</html>
