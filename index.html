<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball HoangGia - Tin Tức Tự Động</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-hover: #22c55e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding: 2rem 1rem; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; }

        /* KHOANG TIN TỨC */
        .news-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #334155;
            margin-top: 1.5rem;
        }

        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .news-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh {
            background: transparent;
            border: 1px solid #475569;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .btn-refresh:hover {
            color: white;
            border-color: var(--accent);
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* THẺ BÀI VIẾT AUTO-LINK */
        .news-card {
            background: #0f172a;
            border-radius: 10px;
            border: 1px solid #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .news-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .news-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .news-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .news-tag {
            align-self: flex-start;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .article-title {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .news-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .news-footer {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed #334155;
            padding-top: 0.6rem;
        }

        .loading-text {
            color: var(--text-muted);
            grid-column: 1/-1;
            text-align: center;
            padding: 2rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="news-section">
        <div class="news-header">
            <div class="news-title">
                <i class="fa-solid fa-newspaper"></i> TIN TỨC & KINH NGHIỆM PICKLEBALL (TỰ ĐỘNG)
            </div>
            <button class="btn-refresh" onclick="fetchAutoPickleballNews()">
                <i class="fa-solid fa-rotate-right"></i> Cập nhật tin mới
            </button>
        </div>
        
        <div class="news-grid" id="newsGrid">
            <div class="loading-text">
                <i class="fa-solid fa-spinner fa-spin"></i> Đang tự động lấy tin tức Pickleball mới nhất...
            </div>
        </div>
    </div>
</div>

<script>
    // Danh sách các bài viết dự phòng (Fallback Data) nếu nguồn mạng không phản hồi
    const fallbackArticles = [
        {
            title: "Đội tuyển Việt Nam toàn thắng tại vòng bảng Pickleball World Cup 2026",
            tag: "Giải Đấu",
            desc: "Các tay vợt Việt Nam thi đấu xuất sắc giành chiến thắng áp đảo tại các nội dung đơn và đôi.",
            img: "https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?q=80&w=800&auto=format&fit=crop",
            url: "https://dantri.com.vn/the-thao/doi-tuyen-viet-nam-toan-thang-tai-vong-bang-pickleball-world-cup-2026-20260903190141946.htm",
            date: "Hôm nay"
        },
        {
            title: "Hướng dẫn kỹ thuật đánh Pickleball cơ bản: Dink, Volley & Serve",
            tag: "Cách Chơi",
            desc: "Các bước làm quen với bộ môn Pickleball cho người mới bắt đầu giúp kiểm soát bóng hiệu quả.",
            img: "https://images.unsplash.com/photo-1554068865-24cecd4e34b8?q=80&w=800&auto=format&fit=crop",
            url: "https://kamito.vn/blogs/news/cach-hoc-pickleball-tu-a-z-cho-nguoi-moi",
            date: "Hướng dẫn"
        },
        {
            title: "Cập nhật thông tin, giải đấu & kết quả Pickleball Việt Nam",
            tag: "Xu Hướng",
            desc: "Tổng hợp các diễn biến mới nhất về phong trào và các giải đấu Pickleball trên toàn quốc.",
            img: "https://images.unsplash.com/photo-1511067007398-7e4b90cfa4bc?q=80&w=800&auto=format&fit=crop",
            url: "https://thethaovanhoa.vn/the-thao/pickleball.htm",
            date: "Mới nhất"
        }
    ];

    // Hàm tự động cào tin từ nguồn RSS Google News
    async function fetchAutoPickleballNews() {
        const grid = document.getElementById('newsGrid');
        grid.innerHTML = '<div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu bài báo...</div>';

        // RSS Feed từ Google News cho từ khóa Pickleball Việt Nam
        const targetRssUrl = "https://news.google.com/rss/search?q=Pickleball+Vi%E1%BB%87t+Nam&hl=vi&gl=VN&ceid=VN:vi";
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(targetRssUrl)}`;

        try {
            const res = await fetch(apiUrl);
            const data = await res.json();

            if (data.status === 'ok' && data.items && data.items.length > 0) {
                grid.innerHTML = '';
                // Lấy 6 bài viết mới nhất
                const articles = data.items.slice(0, 6);

                articles.forEach(item => {
                    // Tự trích xuất hình ảnh hoặc chọn ảnh mặc định chất lượng cao
                    const imgUrl = item.thumbnail || 'https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?q=80&w=800&auto=format&fit=crop';
                    const cleanTitle = item.title.replace(/- [^-]+$/, ''); // Bỏ tên nguồn ở cuối tiêu đề
                    const pubDate = new Date(item.pubDate).toLocaleDateString('vi-VN');

                    grid.innerHTML += `
                        <a href="${item.link}" target="_blank" class="news-card" rel="noopener noreferrer">
                            <img src="${imgUrl}" class="news-img" alt="${cleanTitle}">
                            <div class="news-body">
                                <span class="news-tag">Tin Tự Động</span>
                                <h3 class="article-title">${cleanTitle}</h3>
                                <p class="news-desc">Bấm để chuyển tới bài viết gốc trên trang tin tức...</p>
                                <div class="news-footer">
                                    <span><i class="fa-regular fa-calendar"></i> ${pubDate}</span>
                                    <span style="color:var(--accent);">Đọc bài <i class="fa-solid fa-arrow-up-right-from-square"></i></span>
                                </div>
                            </div>
                        </a>
                    `;
                });
            } else {
                renderFallbackNews();
            }
        } catch (err) {
            console.warn("Không thể tải RSS tự động, sử dụng dữ liệu tin chuẩn:", err);
            renderFallbackNews();
        }
    }

    // Hiển thị tin tức mặc định nếu không có kết nối mạng tới API
    function renderFallbackNews() {
        const grid = document.getElementById('newsGrid');
        grid.innerHTML = '';
        fallbackArticles.forEach(item => {
            grid.innerHTML += `
                <a href="${item.url}" target="_blank" class="news-card" rel="noopener noreferrer">
                    <img src="${item.img}" class="news-img" alt="${item.title}">
                    <div class="news-body">
                        <span class="news-tag">${item.tag}</span>
                        <h3 class="article-title">${item.title}</h3>
                        <p class="news-desc">${item.desc}</p>
                        <div class="news-footer">
                            <span><i class="fa-regular fa-calendar"></i> ${item.date}</span>
                            <span style="color:var(--accent);">Đọc bài <i class="fa-solid fa-arrow-up-right-from-square"></i></span>
                        </div>
                    </div>
                </a>
            `;
        });
    }

    // Tự động chạy khi tải trang
    fetchAutoPickleballNews();
</script>

</body>
</html>
